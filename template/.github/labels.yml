# Bộ label của quy trình (docs/agents/contract.md mục 1). Tên phải khớp từng ký tự.
# Tạo bằng: scripts/setup-labels.sh <owner>/<repo>
# Label app (web, admin, api, mobile...) do setup-labels.sh sinh từ apps[].name trong .claude/project.yml.

# Trạng thái: mỗi issue luôn có đúng một label trong nhóm này.
- {name: "Backlog",      color: "ededed", description: "Issue mới tạo, chưa kiểm tra"}
- {name: "Fail to dev",  color: "f9d0c4", description: "Thiếu mô tả hoặc tiêu chí nghiệm thu; comment ghi rõ phần thiếu"}
- {name: "Ready to dev", color: "0e8a16", description: "Đạt Definition of Ready, sẵn sàng code"}
- {name: "In progress",  color: "1d76db", description: "Đang code trên branch riêng"}
- {name: "In review",    color: "5319e7", description: "Đã mở Pull Request, đang review"}
- {name: "QA",           color: "fbca04", description: "Review đạt; đang viết test case và chạy automation"}
- {name: "QA passed",    color: "0e8a16", description: "Toàn bộ automation test đạt, chờ con người merge"}
- {name: "QA failed",    color: "d93f0b", description: "Còn lỗi sản phẩm sau 3 vòng tự sửa, cần người xử lý"}

# Loại công việc
- {name: "feature", color: "a2eeef", description: "Tính năng"}
- {name: "bug",     color: "d73a4a", description: "Lỗi"}
- {name: "chore",   color: "cfd3d7", description: "Việc kỹ thuật, không đổi hành vi"}
