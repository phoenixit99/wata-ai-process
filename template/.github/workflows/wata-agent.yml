# Chạy skill của quy trình mỗi khi issue nhận label trạng thái có skill tương ứng
# (docs/agents/contract.md mục 1).
#
# QUAN TRỌNG: agent đổi label bằng token của GitHub App (WATA_APP_ID / WATA_APP_PRIVATE_KEY).
# Sự kiện tạo bằng GITHUB_TOKEN không kích hoạt workflow mới, nên bước sau sẽ không bao giờ chạy.
#
#   Backlog       → github-issue-triage (chỉ issue đã được assign: "AI lấy các issue được assign";
#                   issue chưa assign sẽ được triage khi PO assign người)
#   Ready to dev  → github-issue-implement
#   In progress   → github-issue-implement (chỉ chế độ sửa, khi kết quả mới nhất là "## Code review: FAIL")
#   In review     → github-pr-review
#   QA            → qa-test-cases, rồi e2e-playwright
#   Fail to dev, QA passed, QA failed: không chạy gì (chờ con người).
name: wata-agent

on:
  issues:
    types: [labeled, assigned]
  workflow_dispatch:
    inputs:
      issue:
        description: Số issue
        required: true
      skill:
        description: Tên skill (vd github-issue-implement)
        required: true

jobs:
  route:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      skill: ${{ steps.route.outputs.skill }}
      next: ${{ steps.route.outputs.next }}
      issue: ${{ steps.route.outputs.issue }}
      max_turns: ${{ steps.route.outputs.max_turns }}
    steps:
      - uses: actions/checkout@v4

      - name: Route label to skill
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          AUTHOR_ASSOC: ${{ github.event.issue.author_association }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          INPUT_SKILL: ${{ inputs.skill }}
        run: |
          set -euo pipefail
          skill=""; next=""; note=""
          # yq có sẵn trên runner ubuntu-latest của GitHub.
          max_turns=$(yq '.limits.max_turns_per_run // 60' .claude/project.yml)
          labels=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
          has() { case ",$labels," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }
          assignees=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json assignees --jq '.assignees | length')

          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Chỉ chạy khi trạng thái hiện tại của issue khớp với skill được gọi.
            case "$INPUT_SKILL" in
              github-issue-triage)    has "Backlog" && skill="$INPUT_SKILL" ;;
              github-issue-implement) { has "Ready to dev" || has "In progress"; } && skill="$INPUT_SKILL" ;;
              github-pr-review)       has "In review" && skill="$INPUT_SKILL" ;;
              qa-test-cases)          has "QA" && skill="$INPUT_SKILL" ;;
              e2e-playwright)         has "QA" && skill="$INPUT_SKILL" ;;
              *) note="skill '$INPUT_SKILL' không chạy tự động được" ;;
            esac
            [ -z "$skill" ] && [ -z "$note" ] && note="label hiện tại ($labels) không khớp skill $INPUT_SKILL"
          else
            # Chỉ người trong tổ chức mới kích hoạt được agent.
            case "$AUTHOR_ASSOC" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *) note="tác giả issue ($AUTHOR_ASSOC) không phải thành viên; không chạy agent" ;;
            esac
            # Issue vừa được assign: triage nếu đang ở Backlog.
            if [ -z "$note" ] && [ "$ACTION" = "assigned" ]; then
              has "Backlog" && skill="github-issue-triage" || note="assign khi issue không ở Backlog ($labels)"
              LABEL=""
            fi
            # Label của sự kiện đã bị gỡ (người hoặc skill vừa đổi trạng thái) thì bỏ qua.
            [ -z "$note" ] && [ -n "$LABEL" ] && ! has "$LABEL" && note="label $LABEL không còn trên issue ($labels)"
            # Triage chỉ lấy issue đã được assign.
            [ -z "$note" ] && [ "$LABEL" = "Backlog" ] && [ "$assignees" = "0" ] && note="issue chưa được assign; triage chạy khi có người được assign"

            if [ -z "$note" ] && [ -n "$LABEL" ]; then
              case "$LABEL" in
                "Backlog")      skill="github-issue-triage" ;;
                "Ready to dev") skill="github-issue-implement" ;;
                "In progress")
                  # Chỉ chạy khi review yêu cầu sửa (chế độ sửa), không chạy khi implement tự gắn In progress.
                  last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate --jq '.[].body' \
                    | grep -E '^## (Triage|Implementation|Code review|Test cases|Automation report)' | tail -n 1 || true)
                  case "$last" in "## Code review: FAIL"*) skill="github-issue-implement" ;; esac ;;
                "In review")    skill="github-pr-review" ;;
                "QA")           skill="qa-test-cases"; next="e2e-playwright" ;;
              esac
            fi
          fi

          {
            echo "skill=$skill"; echo "next=$next"; echo "issue=$ISSUE"; echo "max_turns=$max_turns"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Route: event=$EVENT label=${LABEL:-} labels=$labels"
            echo "Skill: ${skill:-<none>}${next:+ → $next} ${note:+($note)}"
          } >> "$GITHUB_STEP_SUMMARY"

  run:
    needs: route
    if: needs.route.outputs.skill != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: wata-issue-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.WATA_APP_ID }}
          private-key: ${{ secrets.WATA_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # TODO(project): cài toolchain mà skill cần để lint/test/build (Node + pnpm, Flutter, Playwright...).

      - name: Run skill
        id: skill
        timeout-minutes: 55
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: "/${{ needs.route.outputs.skill }} ${{ needs.route.outputs.issue }} --auto"
          claude_args: "--max-turns ${{ needs.route.outputs.max_turns }}"

      # Bước 6 (automation) chạy ngay sau Bước 5 (test case) trên cùng issue ở trạng thái QA.
      - name: Run next skill
        id: next
        if: needs.route.outputs.next != '' && steps.skill.outcome == 'success'
        timeout-minutes: 55
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: "/${{ needs.route.outputs.next }} ${{ needs.route.outputs.issue }} --auto"
          claude_args: "--max-turns ${{ needs.route.outputs.max_turns }}"

      # Lần chạy lỗi (lỗi API, hết lượt, quá thời gian): báo trên issue để người xử lý. Không đổi label.
      - name: Báo khi lần chạy lỗi
        if: failure() || cancelled()
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ needs.route.outputs.issue }}
          SKILL: ${{ needs.route.outputs.skill }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: Number(process.env.ISSUE), body:
              `Lần chạy agent (\`${process.env.SKILL}\`) bị lỗi, cần người xử lý. Log: ${runUrl}\n\n` +
              `Sửa nguyên nhân rồi chạy lại bằng workflow_dispatch của \`wata-agent\`.` });
