# Cấu hình project cho bộ quy trình WATA AI Agent.
# Schema: docs/agents/contract.md mục 9. Tech Lead điền trước khi bật agent.

process_version: "1.0.0"
language: vi
repo: <owner>/<repo>
default_branch: main

apps:
  - name: web
    path: apps/web
    stack: nextjs
    standard: apps/web/CODING_STANDARD.md        # nextjs-coding-standard
    commands:
      lint: "pnpm --filter web lint"
      typecheck: "pnpm --filter web typecheck"
      test: "pnpm --filter web test"
      build: "pnpm --filter web build"
  - name: admin
    path: apps/admin
    stack: nextjs
    standard: apps/admin/CODING_STANDARD.md      # nextjs-coding-standard
    commands:
      lint: "pnpm --filter admin lint"
      typecheck: "pnpm --filter admin typecheck"
      test: "pnpm --filter admin test"
      build: "pnpm --filter admin build"
  - name: api
    path: apps/api
    stack: nestjs
    standard: apps/api/CODING_STANDARD.md        # nestjs-coding-standard
    commands:
      lint: "pnpm --filter api lint"
      typecheck: "pnpm --filter api typecheck"
      test: "pnpm --filter api test"
      build: "pnpm --filter api build"
  - name: mobile
    path: apps/mobile
    stack: flutter
    standard: apps/mobile/CODING_STANDARD.md     # flutter-coding-standard
    commands:
      lint: "cd apps/mobile && flutter analyze"
      typecheck: "cd apps/mobile && flutter analyze"
      test: "cd apps/mobile && flutter test"
      build: "cd apps/mobile && flutter build apk --debug"

shared_contract: packages/shared
e2e:
  path: e2e
  command: "pnpm --filter e2e test"

people:            # GitHub login, không có @
  po: []
  tech_lead: []
  qa: []
  designer: []

limits:
  max_fix_rounds: 3          # giới hạn 3 vòng cho review và automation (quy trình mục 9)
  max_turns_per_run: 60
